<!DOCTYPE html>
<html>
<head>
<title>Express JS</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
 <div class="section">
    <h1>Fill the Details</h1>
    <form action="/contact" method="post">
      <div>
         <label for="name">Name</label>
         <!-- <input type="text" name="name" id="name" placeholder="Write your name here"> -->
          <input type="text" name="user[name]" id="name" placeholder="Write your name here">
      </div>
      <div>
         <label for="message">Message</label>
         <!-- <textarea name="message" id="message" placeholder="Write your message here"></textarea> -->
          <textarea name="user[message]" id="message" placeholder="Write your message here"></textarea>
      </div>
      <button>Submit</button>
    </form>
 </div>
</body>
</html>
