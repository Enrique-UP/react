<!DOCTYPE html>
<html>
<head>
<title>Javascript Arrow Functions</title>
<style type="text/css">
    *{padding:0;margin:0;box-sizing: border-box;}
    body{padding:50px;}
    h1{margin-bottom: 30px;}
    p{margin-bottom: 10px;font-weight: bold;}
</style>
</head>
<body>
<h1>Primitive Types</h1>
<pre>
    const person = {
        name: "Max", 
        age: 40
    };
    const sperson = {
        ...person
    };
    person.name = "Manu";
    console.log(sperson); // { name: "Max", age: 40 }
    console.log(sperson.name); // Max
    console.log(person.name); // Manu
</pre>

<script type="text/javascript">
    const person = {
        name: "Max", 
        age: 40
    };
    const sperson = {
        ...person
    };
    person.name = "Manu";
    console.log(sperson); // { name: "Max", age: 40 }
    console.log(sperson.name); // Max
    console.log(person.name); // Manu
</script>
</body>
</html>
